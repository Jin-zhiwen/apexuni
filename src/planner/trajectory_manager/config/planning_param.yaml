######################## car model ########################
# Physical parameters
max_vel: 0.25
max_acc: 0.5
max_domega: 1.0
zoom_omega: 0.30
max_cur: 6.0

# Virtual wheelbase used by the car-like kinodynamic model. Keep this compact for
# Go2 indoor exploration so the planner can still generate tight turns.
wheel_base: 0.14

# Collision proxy for Unitree Go2. Keep the body envelope compact for indoor
# exploration; this matches the earlier real-world tuning that allowed the robot
# to move through narrow passages.
length: 0.50
width: 0.30
height: 0.40

# Offset the collision box slightly backward from the odom/body origin so goals
# near walls are not rejected by the front edge too aggressively.
odom_to_center_x: -0.10
odom_to_center_y: 0.0

######################## kinoastar ########################
# A* oneshot curvature
astar_cur: 10

# Forward search displacement
step_arc: 0.2

# Yaw discretization interval for KinoAstar node hashing (rad)
yaw_resolution: 0.317460317

# Greedy search coefficient
lambda_heu: 1.0

# Maximum search time
max_seach_time: 2.0

# Discretization interval for oneshot intermediate point collision checks
checkl: 0.05

# Number of checks when expanding states in A*
check_num: 5

# Considered stationary if speed below this
non_siguav: 0.01

# Oneshot range (TODO: reducing it may cause self-rotation)
oneshot_range: 0.8

# Sampling time passed to backend
sampletime: 0.1

# Collision check sampling interval; match map resolution to avoid missing thin obstacles.
collision_interval: 0.05

# Hard collision uses the true robot footprint over raw occupancy plus a safety
# skin for gait sway, VIO drift, and door-frame depth noise.
hard_collision_padding: 0.03

######################## global planning ########################
time_weight: 15.0

# v_weight  a_weight omega_weight  domega_weight colli_weight
penaltyWeights: [5, 5, 20, 5, 1000]

# Additional sampling for continuity
denseResolution: 20

# Average sampling
sparseResolution: 8

# Backend sampling time
timeResolution: 1

# Safety distance for trajectory optimization. With algorithm_traj.xml's 0.08 m
# map inflation, 0.14 m keeps a modest centerline clearance while the footprint
# checker handles the true body width plus padding.
safe_dist: 0.13
