######################## car model ########################
# Physical parameters
max_vel: 0.25
max_acc: 0.5
max_domega: 1.0
zoom_omega: 0.30
max_cur: 6.0

# Virtual wheelbase used by the car-like kinodynamic model. Keep this compact for
# Go2 indoor exploration so the planner can still generate tight turns.
wheel_base: 0.14

# Collision proxy for Unitree Go2, centered on the body odometry origin. The
# D435i lens is measured 0.345 m ahead of the Go2 center, so a 0.70 m length
# places it just inside the 0.35 m front edge instead of leaving it unprotected.
length: 0.70
width: 0.30
height: 0.40

# /kimera_vio_ros/body_odometry is now translated from the D435i lens to the
# measured Go2 center. Keep the collision proxy centered on that body origin.
odom_to_center_x: 0.0
odom_to_center_y: 0.0

######################## kinoastar ########################
# A* oneshot curvature
astar_cur: 10

# Forward search displacement
step_arc: 0.2

# Yaw discretization interval for KinoAstar node hashing (rad)
yaw_resolution: 0.317460317

# Greedy search coefficient
lambda_heu: 1.0

# Maximum search time
max_seach_time: 2.0

# Discretization interval for oneshot intermediate point collision checks
checkl: 0.05

# Number of checks when expanding states in A*
check_num: 5

# Considered stationary if speed below this
non_siguav: 0.01

# Oneshot range (TODO: reducing it may cause self-rotation)
oneshot_range: 0.8

# Sampling time passed to backend
sampletime: 0.1

# Collision check sampling interval; match map resolution to avoid missing thin obstacles.
collision_interval: 0.05

# Hard collision uses the true robot footprint over raw occupancy plus a safety
# skin for gait sway, VIO drift, and door-frame depth noise.
hard_collision_padding: 0.03

######################## global planning ########################
time_weight: 15.0

# v_weight  a_weight omega_weight  domega_weight colli_weight
penaltyWeights: [5, 5, 20, 5, 1000]

# Additional sampling for continuity
denseResolution: 20

# Average sampling
sparseResolution: 8

# Backend sampling time
timeResolution: 1

# Keep the ESDF penalty modest because unknown cells are also represented as
# obstacles in the current partial map. KinoAstar's rectangular footprint
# checker provides the hard Go2 collision envelope.
safe_dist: 0.13
