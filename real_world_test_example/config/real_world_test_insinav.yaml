detector:
  yolo:
    confidence_threshold_yolo: 0.3
    iou_threshold_yolo: 0.5
    agnostic_nms: True

  groundingDINO:
    confidence_threshold_dino: 0.35
    text_threshold: 0.20

sync_slop: 0.05
subscriber_queue_size: 1
sync_queue_size: 2
max_frame_age: 0.8
clock_offset_tolerance: 0.0
max_sensor_pose_dt: 0.10
max_rgb_depth_dt: 0.08

goal:
  goal_type: ins-image
  image_path: "/home/jzw/apexuni/ApexNav/data/screen.jpg"
  goal_label: ""
  goal_image_topic: ""
  infer_label: true
  yolo_port: 12184

insinav_filter:
  enabled: true
  use_similar_set: false  # 实机图像目标只用主类别，避免 couch/toilet/potted plant 等相似集合吸引误检
  goal_topk: 2
  no_detection_patience: 8

clip:
  model_name: "dino_vits16"
  device: "cuda"
  # [修复1] 条件化 DINO 计分：仅在检测到物体时计算相似度
  use_candidate_crops: true  # 仅使用检测到的物体裁剪，而不是全帧
  topk: 1  # 取 top-1 相似度分数
  crop_padding_ratio: 0.1
  no_candidate_mode: "full_frame"  # 无候选时直接使用低分，避免全帧负相似度扰动
  no_candidate_score: 0.0  # 没有检测到物体时的分数

lightglue:
  enabled: true
  device: "cuda"
  max_num_keypoints: 1024
  # [修复2] LightGlue 停止门机制配置
  use_object_crop_for_matching: true  # 先从 goal image 裁出目标实例，再送入 DINO/LightGlue
  goal_crop_padding_ratio: 0.12
  max_goal_auto_crop_area_ratio: 0.90  # YOLO 把整张 goal image 当目标时拒绝该自动 crop
  goal_crop_roi: []  # 可手动填 [x1, y1, x2, y2]，归一化坐标，例如 [0.05, 0.02, 0.95, 0.98]
  min_match_points: 50  # 实例级候选 raw match 阈值，避免被同类 chair 误吸引
  candidate_min_match_points: 50  # 导航候选必须先过实例匹配门，不能只凭 YOLO 类别
  candidate_min_inlier_points: 15  # 导航候选 RANSAC 内点门，过滤同类但不同实例
  candidate_min_inlier_ratio: 0.30
  approach_min_match_points: 12  # 已经锁定目标后，近距离弱纹理画面允许更低匹配数维持靠近
  approach_min_inlier_points: 4  # 近距离维持阶段允许更少内点，避免靠近后纹理视角变化立刻丢目标
  approach_min_inlier_ratio: 0.30
  approach_lock_max_lost_frames: 3  # 连续若干帧弱匹配仍保持目标锁定，防止靠近时在 PENDING 和探索间抖动
  approach_lock_max_distance: 1.6  # 只有仍在目标附近时才保持锁定，避免远处误锁
  score_threshold: 70.0  # 发布 VERIFIED/PENDING_FAR 的 LightGlue 停止门阈值
  min_inlier_points: 25  # 最终停止 RANSAC 内点数，比导航候选略严格
  min_inlier_ratio: 0.30  # 内点占匹配比例，过滤只匹配到局部椅背/桌边的候选
  ransac_reproj_threshold: 5.0
  blend_weight: 0.7
  hard_gate: true  # 硬门控：严格要求匹配点数
  crop_padding_ratio: 0.1
  stop_distance: 1.0  # 停止距离阈值（米）
  stop_enter_distance: 1.00  # 进入标称 1m 停止距离就开始确认，避免到目标后又转向离开
  stop_exit_distance: 1.10  # 进入停止候选后允许小幅深度抖动，不让状态频繁 PENDING_FAR
  distance_percentile: 30.0  # 用 mask 内深度中位数判定停止，降低地面/前景边缘造成的偏近误停
  stop_confirm_frames: 2  # 连续满足停止门的帧数，避免单帧 LightGlue/深度抖动误停

# [修复3] 实机停止门机制启用
insinav_stop_gate_enabled: true  # 启用 LightGlue 停止门验证
insinav_stop_reject_turn_patience: 5  # 拒绝次数达到此值后进行转向以更新感知

habitat_sensor:
  camera_height: 0.43
  # 深度尺度配置：确保深度单位为“米”后再做 stop_distance 判断
  # depth_normalized=true 表示深度在 [0,1]，会乘以 depth_max_range
  depth_normalized: false
  depth_max_range: 10.0
  # depth_scale 用于把 mm 等单位转换为米，例如 RealSense(mm) -> 0.001
  depth_scale: 0.001
  depth_min: 0.30
  depth_max: 3.0
  hfov: 79.43
  height: 480
  width: 640

habitat:
  simulator:
    agents:
      main_agent:
        sim_sensors:
          depth_sensor:
            position: [0.0, 0.43, 0.0]
            min_depth: 0.30
            max_depth: 3.0
            hfov: 79.43
            height: 480
            width: 640

llm:
  llm_answer_path: llm/answers/llm_answer_hm3d.txt
  llm_response_path: llm/answers/llm_response_list.txt
  llm_client:
    llm_client: ollama
    ollama: "qwen3:8b"

record_file_name: "record.txt"
continue_file_name: "continue.txt"
need_video: false
video_output_path: "videos/test_insinav_{split}"

ros_topics:
  rgb_topic: /camera/color/image_raw
  depth_topic: /camera/depth/image_rect_raw
  sensor_pose_topic: /camera/sensor_pose
  odom_topic: /kimera_vio_ros/body_odometry
